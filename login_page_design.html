<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agentic AI Healthcare Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #007bb5; /* Apollo Blue */
            --primary-dark: #005a87;
            --secondary: #00bcd4; /* Apollo Teal */
            --bg-color: #f4f7f6;
            --text-main: #333333;
            --text-light: #777777;
            --white: #ffffff;
            --border: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-container {
            width: 900px;
            height: 550px;
            background-color: var(--white);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Left Side - Geometric Pattern */
        .left-panel {
            width: 40%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Geometric Shapes */
        .left-panel::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -50%;
            width: 150%;
            height: 150%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(-30deg);
            z-index: 1;
        }
        
        .left-panel::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -20%;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.05);
            transform: rotate(45deg);
            z-index: 1;
        }

        /* Tab Switcher */
        .tab-switcher {
            position: absolute;
            right: 0;
            top: 30%;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .tab {
            padding: 15px 30px;
            font-weight: 700;
            cursor: pointer;
            text-align: right;
            transition: all 0.3s ease;
        }

        .tab.active {
            background-color: var(--white);
            color: var(--primary);
            border-radius: 30px 0 0 30px;
            box-shadow: -5px 5px 15px rgba(0,0,0,0.05);
        }

        .tab.inactive {
            color: rgba(255, 255, 255, 0.7);
        }

        .tab.inactive:hover {
            color: var(--white);
        }

        /* Right Side - Form */
        .right-panel {
            width: 60%;
            height: 100%;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin: 0 auto 15px;
            box-shadow: 0 10px 20px rgba(0, 188, 212, 0.3);
        }

        .header h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .form-group {
            position: relative;
            margin-bottom: 30px;
        }

        .form-group i {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 18px;
        }

        .form-control {
            width: 100%;
            padding: 12px 10px 12px 35px;
            border: none;
            border-bottom: 2px solid var(--border);
            font-size: 16px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s ease;
            background: transparent;
        }

        .form-control:focus {
            border-bottom-color: var(--primary);
        }

        .form-control::placeholder {
            color: #aaaaaa;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .btn-login {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 123, 181, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 123, 181, 0.4);
        }

        .social-login {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .social-login span {
            color: var(--text-light);
            font-size: 14px;
            font-weight: 600;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 20px;
            transition: background-color 0.3s ease;
        }

        .social-btn:hover {
            background-color: #f0f0f0;
        }

        .social-btn.google i {
            color: #DB4437;
        }

        .social-btn.facebook i {
            color: #4267B2;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Left Panel with Tab Cutouts -->
        <div class="left-panel">
            <div class="tab-switcher">
                <div class="tab active">LOGIN</div>
                <div class="tab inactive">SIGN IN</div>
            </div>
        </div>

        <!-- Right Panel with Form -->
        <div class="right-panel">
            <div class="header">
                <div class="avatar">
                    <i class="fa-regular fa-user"></i>
                </div>
                <h1>LOGIN</h1>
            </div>

            <form action="#" method="POST">
                <div class="form-group">
                    <i class="fa-regular fa-circle-user"></i>
                    <input type="email" class="form-control" placeholder="Email" required>
                </div>

                <div class="form-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <button type="submit" class="btn-login">LOGIN</button>
                </div>
            </form>

            <div class="social-login">
                <span>Or Login With</span>
                <a href="#" class="social-btn google">
                    <i class="fa-brands fa-google"></i> Google
                </a>
                <a href="#" class="social-btn facebook">
                    <i class="fa-brands fa-facebook"></i> Facebook
                </a>
            </div>
        </div>
    </div>

</body>
</html>
